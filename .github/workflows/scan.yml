name: scan
on:
  schedule:
    - cron: "*/15 3-10 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && python scan.py
      - run: |
          git config user.name "scan-bot"; git config user.email "bot@users.noreply.github.com"
          git add data.json; git commit -m "update data" || exit 0; git push
