name: India EOD Swing Intelligence
on:
  schedule:
    # 16:15 IST = 10:45 UTC, Monday to Friday (GitHub may start scheduled jobs a little late).
    - cron: "45 10 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: india-eod-swing-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Dhan-free scanner dependencies
        run: python -m pip install --upgrade pip numpy pandas requests yfinance lxml html5lib
      - name: Run EOD swing scan (daily candles, 1-3 session horizon)
        env:
          PYTHONUNBUFFERED: "1"
        run: python scan.py
      - name: Commit latest dashboard data
        run: |
          git config user.name "scan-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json EOD_Swing_Report_LATEST.json
          git commit -m "refresh EOD swing intelligence dashboard" || echo "No data changes to commit"
          git push
